<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="bgGrad1200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030603" />
      <stop offset="40%" stop-color="#081008" />
      <stop offset="100%" stop-color="#020402" />
    </linearGradient>
    <pattern id="grid1200" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00ff66" stroke-width="0.8" stroke-opacity="0.22" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bgGrad1200)" />
  <rect width="1200" height="750" fill="url(#grid1200)" />
  
  <!-- Cyber Circuit Array -->
  <path d="M50 70 H350 L430 150 H770 L850 70 H1150" stroke="#00ff66" stroke-width="4" fill="none" stroke-dasharray="16 8" />
  <path d="M50 680 H280 L390 570 H810 L920 680 H1150" stroke="#ffee00" stroke-width="4" fill="none" />
  
  <!-- High Density Mainframe Rack 1200W -->
  <rect x="220" y="140" width="760" height="470" fill="#060c06" stroke="#00ff66" stroke-width="6" rx="4" />
  
  <!-- Top Telemetry Panel -->
  <rect x="230" y="152" width="740" height="50" fill="#00ff66" fill-opacity="0.18" stroke="#00ff66" stroke-width="2" />
  <circle cx="265" cy="177" r="10" fill="#00ff66" />
  <circle cx="300" cy="177" r="10" fill="#ffee00" />
  <circle cx="335" cy="177" r="10" fill="#ff007f" />
  <text x="375" y="185" fill="#00ff66" font-family="monospace" font-size="20" font-weight="bold">MAINFRAME // 1200W HIGH-FIDELITY CYBER RIG</text>
  
  <!-- Blade Racks in 2 Columns -->
  <!-- Col 1 -->
  <g fill="#0b170b" stroke="#00ff66" stroke-width="2">
    <rect x="245" y="225" width="345" height="70" />
    <rect x="245" y="315" width="345" height="70" />
    <rect x="245" y="405" width="345" height="70" />
    <rect x="245" y="495" width="345" height="70" />
  </g>
  <!-- Col 2 -->
  <g fill="#0b170b" stroke="#00ff66" stroke-width="2">
    <rect x="610" y="225" width="345" height="70" />
    <rect x="610" y="315" width="345" height="70" />
    <rect x="610" y="405" width="345" height="70" />
    <rect x="610" y="495" width="345" height="70" />
  </g>
  
  <!-- Col 1 Labels -->
  <text x="260" y="255" fill="#ffee00" font-family="monospace" font-size="13" font-weight="bold">RACK-A1 // EXPRESS KERNEL</text>
  <text x="260" y="275" fill="#00ff66" font-family="monospace" font-size="11">Throughput: 84,200 req/s | SSL: TLS 1.3</text>
  
  <text x="260" y="345" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">RACK-A2 // AUDIO DSP OSCILLATORS</text>
  <text x="260" y="365" fill="#00ff66" font-family="monospace" font-size="11">Web Audio Context: 48kHz Stereo 8-bit</text>
  
  <text x="260" y="435" fill="#ff007f" font-family="monospace" font-size="13" font-weight="bold">RACK-A3 // THREE.JS 3D ACCELERATOR</text>
  <text x="260" y="455" fill="#00ff66" font-family="monospace" font-size="11">WebGL 2.0 / 60 FPS Lock / Shaders</text>
  
  <text x="260" y="525" fill="#ffee00" font-family="monospace" font-size="13" font-weight="bold">RACK-A4 // WHATSAPP SCHEDULER</text>
  <text x="260" y="545" fill="#00ff66" font-family="monospace" font-size="11">Automated dispatch / RFC3339 Parser</text>
  
  <!-- Col 2 Labels -->
  <text x="625" y="255" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">RACK-B1 // SCSS GRID COMPILER</text>
  <text x="625" y="275" fill="#00ff66" font-family="monospace" font-size="11">Fluid rem/vw/vh responsive scaling</text>
  
  <text x="625" y="345" fill="#ff007f" font-family="monospace" font-size="13" font-weight="bold">RACK-B2 // GEMINI AI GATEWAY</text>
  <text x="625" y="365" fill="#00ff66" font-family="monospace" font-size="11">Interactions Stream / Cyberpunk Persona</text>
  
  <text x="625" y="435" fill="#ffee00" font-family="monospace" font-size="13" font-weight="bold">RACK-B3 // GITHUB ORG MONITOR</text>
  <text x="625" y="455" fill="#00ff66" font-family="monospace" font-size="11">Auto-sync 20+ open source repositories</text>
  
  <text x="625" y="525" fill="#00ff66" font-family="monospace" font-size="13" font-weight="bold">RACK-B4 // RETRO TERMINAL EMULATOR</text>
  <text x="625" y="545" fill="#00ff66" font-family="monospace" font-size="11">ANSI Color support / Command Registry</text>

  <!-- Bottom Telemetry status -->
  <rect x="230" y="575" width="740" height="22" fill="#ffee00" fill-opacity="0.15" stroke="#ffee00" stroke-width="1.5" />
  <text x="280" y="591" fill="#ffee00" font-family="monospace" font-size="12" font-weight="bold">ELSHANDAY CORE SYSTEM: FULL OPERATIONAL CAPACITY // SECURED</text>
</svg>
