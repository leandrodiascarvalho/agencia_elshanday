<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050805" />
      <stop offset="100%" stop-color="#0a140a" />
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#00ff66" stroke-width="0.5" stroke-opacity="0.15" />
    </pattern>
  </defs>
  <rect width="400" height="250" fill="url(#bgGrad)" />
  <rect width="400" height="250" fill="url(#grid)" />
  <!-- Circuit lines -->
  <path d="M20 30 H120 L150 60 H280 L300 40 H380" stroke="#00ff66" stroke-width="2" fill="none" stroke-dasharray="6 3" />
  <path d="M20 220 H100 L140 180 H260 L290 210 H380" stroke="#ffee00" stroke-width="2" fill="none" />
  <!-- Hardware Rig Center Box -->
  <rect x="110" y="70" width="180" height="110" fill="#080d08" stroke="#00ff66" stroke-width="3" />
  <rect x="120" y="80" width="160" height="20" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="1" />
  <circle cx="135" cy="90" r="4" fill="#00ff66" />
  <circle cx="150" cy="90" r="4" fill="#ffee00" />
  <circle cx="165" cy="90" r="4" fill="#ff007f" />
  <text x="180" y="94" fill="#00ff66" font-family="monospace" font-size="10" font-weight="bold">RACK-SYS // 400W</text>
  <!-- Cooling Vents -->
  <line x1="125" y1="115" x2="275" y2="115" stroke="#00ff66" stroke-width="2" />
  <line x1="125" y1="125" x2="275" y2="125" stroke="#00ff66" stroke-width="2" />
  <line x1="125" y1="135" x2="275" y2="135" stroke="#00ff66" stroke-width="2" />
  <line x1="125" y1="145" x2="275" y2="145" stroke="#00ff66" stroke-width="2" />
  <rect x="130" y="155" width="140" height="15" fill="#ffee00" fill-opacity="0.2" stroke="#ffee00" stroke-width="1" />
  <text x="140" y="166" fill="#ffee00" font-family="monospace" font-size="9">CPU_LOAD: 42% [OPTIMAL]</text>
  <!-- Scanline bar -->
  <rect x="0" y="240" width="400" height="10" fill="#00ff66" fill-opacity="0.3" />
</svg>
