<body class="bg-[#050805] text-[#00ff66] font-mono selection:bg-[#00ff66] selection:text-[#050805] min-h-screen antialiased overflow-x-hidden flex flex-col relative">

  <!-- 3D Global Cyberspace Canvas Layer -->
  <canvas id="cyberspace-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-30"></canvas>

  <!-- TOP STATUS TICKER -->
  <div id="status-ticker" class="relative z-50 w-full bg-black border-b-2 border-[#00ff66]/60 px-4 py-1.5 flex items-center justify-between text-[11px] font-['Share_Tech_Mono'] text-[#00ff66] overflow-hidden select-none">
    <div class="flex items-center gap-3 sm:gap-4">
      <span class="text-[#ffee00] flex items-center gap-1.5 font-bold">
        <span class="inline-block w-2 h-2 rounded-full bg-[#00ff66] animate-ping"></span>
        SYS.NODE: ONLINE
      </span>
      <span class="hidden md:inline text-[#00f0ff] text-xs">STACK: HTML5 + SCSS + ES6 + NODE + EXPRESS</span>
    </div>

    <div class="flex items-center gap-3 sm:gap-4 text-xs">
      <button id="crt-toggle-btn" class="hover:text-[#ffee00] cursor-pointer transition-colors" title="Alternar scanlines CRT">[CRT: ON]</button>
      <button id="btn-audio-toggle" class="hover:text-[#ffee00] cursor-pointer transition-colors" title="Alternar som">
        <span>🔊</span> AUDIO: [OFF]
      </button>
      <button id="theme-cycle-btn" class="text-[#ffee00] hover:underline cursor-pointer" title="Alternar paleta">
        THEME: <span id="current-theme-label">Pixel Art Retro</span>
      </button>
    </div>
  </div>

  <!-- MAIN HEADER -->
  <header id="main-header" class="sticky top-0 z-40 bg-[#050805]/90 backdrop-blur-md border-b-2 border-[#00ff66]/40 px-4 sm:px-8 py-3 shadow-[0_4px_15px_rgba(0,0,0,0.8)] transition-all duration-300">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
