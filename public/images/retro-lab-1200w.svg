<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <linearGradient id="labGrad1200" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060205" />
      <stop offset="40%" stop-color="#180714" />
      <stop offset="70%" stop-color="#0a0208" />
      <stop offset="100%" stop-color="#030104" />
    </linearGradient>
    <pattern id="pixelGrid1200" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="none" stroke="#ffee00" stroke-width="0.5" stroke-opacity="0.16" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#labGrad1200)" />
  <rect width="1200" height="750" fill="url(#pixelGrid1200)" />
  
  <!-- Studio Triple Monitor Array -->
  <!-- Left Screen: SCSS / Typography Architecture -->
  <rect x="70" y="120" width="320" height="360" fill="#040804" stroke="#00ff66" stroke-width="5" rx="8" />
  <rect x="85" y="135" width="290" height="315" fill="#000000" stroke="#00ff66" stroke-width="2" />
  <text x="100" y="170" fill="#00ff66" font-family="monospace" font-size="14" font-weight="bold">&gt; UNIDADES_RELATIVAS.SCSS</text>
  <text x="100" y="200" fill="#ffee00" font-family="monospace" font-size="11">/* Escalas Fluidas */</text>
  <text x="100" y="225" fill="#00f0ff" font-family="monospace" font-size="11">--font-size-base: 1rem;</text>
  <text x="100" y="250" fill="#00f0ff" font-family="monospace" font-size="11">--container-w: 92vw;</text>
  <text x="100" y="275" fill="#00f0ff" font-family="monospace" font-size="11">--section-min-h: 70vh;</text>
  <text x="100" y="300" fill="#00f0ff" font-family="monospace" font-size="11">--col-fraction: 1fr 1fr 2fr;</text>
  <text x="100" y="325" fill="#00f0ff" font-family="monospace" font-size="11">--badge-pad: 0.25em 0.75em;</text>
  <text x="100" y="350" fill="#ff007f" font-family="monospace" font-size="11">--btn-pad-x: 2em; /* 2x Y */</text>
  <text x="100" y="375" fill="#ffee00" font-family="monospace" font-size="11">/* Breakpoints Media Queries */</text>
  <text x="100" y="400" fill="#00ff66" font-family="monospace" font-size="11">@media (max-width: 639px) { ... }</text>
  <text x="100" y="425" fill="#00ff66" font-family="monospace" font-size="11">@media (min-width: 1024px) { ... }</text>
  
  <!-- Center Main Screen: CSS Grid & Flexbox Canvas -->
  <rect x="420" y="90" width="360" height="420" fill="#060809" stroke="#00f0ff" stroke-width="6" rx="10" />
  <rect x="435" y="105" width="330" height="375" fill="#000000" stroke="#00f0ff" stroke-width="2" />
  <text x="450" y="140" fill="#00f0ff" font-family="monospace" font-size="15" font-weight="bold">&gt; CSS_GRID_BENTO_LAYOUT</text>
  
  <!-- Mockup of 12-column grid visualizer -->
  <rect x="450" y="160" width="300" height="50" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="2" />
  <text x="460" y="190" fill="#00f0ff" font-family="monospace" font-size="11">HEADER: FLEXBOX (SPACE-BETWEEN)</text>
  
  <rect x="450" y="220" width="190" height="110" fill="#00ff66" fill-opacity="0.15" stroke="#00ff66" stroke-width="2" />
  <text x="460" y="250" fill="#00ff66" font-family="monospace" font-size="11">GRID TRACK: 2fr</text>
  <text x="460" y="275" fill="#00ff66" font-family="monospace" font-size="10">HERO + TYPEWRITER</text>
  
  <rect x="650" y="220" width="100" height="110" fill="#ffee00" fill-opacity="0.15" stroke="#ffee00" stroke-width="2" />
  <text x="660" y="250" fill="#ffee00" font-family="monospace" font-size="10">TRACK: 1fr</text>
  <text x="660" y="275" fill="#ffee00" font-family="monospace" font-size="9">3D VOXEL</text>
  
  <rect x="450" y="340" width="300" height="110" fill="#ff007f" fill-opacity="0.15" stroke="#ff007f" stroke-width="2" />
  <text x="460" y="370" fill="#ff007f" font-family="monospace" font-size="11">RESPONSIVE SRCSET SHOWCASE</text>
  <text x="460" y="395" fill="#ff007f" font-family="monospace" font-size="10">sizes="(max-width: 640px) 100vw, 50vw"</text>
  <text x="460" y="420" fill="#ff007f" font-family="monospace" font-size="10">srcset="400w, 800w, 1200w"</text>
  
  <!-- Right Screen: Responsive Preview (Mobile, Tablet, Desktop) -->
  <rect x="810" y="120" width="320" height="360" fill="#0a0208" stroke="#ff007f" stroke-width="5" rx="8" />
  <rect x="825" y="135" width="290" height="315" fill="#000000" stroke="#ff007f" stroke-width="2" />
  <text x="840" y="170" fill="#ff007f" font-family="monospace" font-size="14" font-weight="bold">&gt; DISPOSITIVOS // PREVIEW</text>
  
  <!-- Phone representation -->
  <rect x="840" y="195" width="60" height="100" fill="#150510" stroke="#00ff66" stroke-width="1.5" rx="4" />
  <text x="850" y="250" fill="#00ff66" font-family="monospace" font-size="9">390px</text>
  <text x="850" y="265" fill="#00ff66" font-family="monospace" font-size="8">100%</text>
  
  <!-- Tablet representation -->
  <rect x="915" y="195" width="90" height="110" fill="#150510" stroke="#ffee00" stroke-width="1.5" rx="4" />
  <text x="935" y="250" fill="#ffee00" font-family="monospace" font-size="9">768px</text>
  <text x="935" y="265" fill="#ffee00" font-family="monospace" font-size="8">2fr</text>
  
  <!-- Desktop representation -->
  <rect x="1020" y="195" width="85" height="110" fill="#150510" stroke="#00f0ff" stroke-width="1.5" rx="4" />
  <text x="1035" y="250" fill="#00f0ff" font-family="monospace" font-size="9">1440px</text>
  <text x="1035" y="265" fill="#00f0ff" font-family="monospace" font-size="8">4fr</text>
  
  <text x="840" y="340" fill="#ffee00" font-family="monospace" font-size="11">BREAKPOINT AUTOMATION:</text>
  <text x="840" y="365" fill="#00f0ff" font-family="monospace" font-size="10">✓ Flexbox auto-wrap</text>
  <text x="840" y="390" fill="#00ff66" font-family="monospace" font-size="10">✓ Fluid CSS Grid tracks</text>
  <text x="840" y="415" fill="#ff007f" font-family="monospace" font-size="10">✓ Viewport-adapted srcset</text>
  
  <!-- Monitor Stands & Desk -->
  <polygon points="200,480 260,480 280,530 180,530" fill="#121212" stroke="#00ff66" stroke-width="2" />
  <polygon points="560,510 640,510 660,560 540,560" fill="#121212" stroke="#00f0ff" stroke-width="2.5" />
  <polygon points="940,480 1000,480 1020,530 920,530" fill="#121212" stroke="#ff007f" stroke-width="2" />
  <rect x="40" y="550" width="1120" height="40" fill="#0d0d0d" stroke="#ffee00" stroke-width="4" />
  
  <!-- Bottom Status HUD -->
  <rect x="180" y="650" width="840" height="38" fill="#0b030b" stroke="#ffee00" stroke-width="2" />
  <text x="600" y="674" text-anchor="middle" fill="#ffee00" font-family="monospace" font-size="14" font-weight="bold">DIGITAL BRUTALISM &amp; HIGH-DENSITY RESPONSIVE SUITE // 1200W</text>
</svg>
