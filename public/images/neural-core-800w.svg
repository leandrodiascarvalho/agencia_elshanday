<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="neuralGrad800" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050308" />
      <stop offset="50%" stop-color="#100518" />
      <stop offset="100%" stop-color="#020104" />
    </linearGradient>
    <radialGradient id="coreGlow800" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ff007f" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#ffee00" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00f0ff" fill-opacity="0.25" />
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#neuralGrad800)" />
  <rect width="800" height="500" fill="url(#dotGrid)" />
  
  <!-- Circuit and Synapse Network -->
  <path d="M50 80 H250 L350 200 H450 L550 80 H750" stroke="#00f0ff" stroke-width="2" fill="none" stroke-dasharray="8 6" />
  <path d="M50 420 H250 L350 300 H450 L550 420 H750" stroke="#ff007f" stroke-width="2" fill="none" stroke-dasharray="8 6" />
  
  <!-- Outer Quantum Ring -->
  <circle cx="400" cy="250" r="150" fill="url(#coreGlow800)" />
  <circle cx="400" cy="250" r="130" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="14 7" />
  <circle cx="400" cy="250" r="95" fill="none" stroke="#ffee00" stroke-width="3" stroke-dasharray="8 4" />
  <circle cx="400" cy="250" r="60" fill="#150622" stroke="#ff007f" stroke-width="4" />
  <circle cx="400" cy="250" r="30" fill="#00f0ff" />
  
  <!-- Neural Nodes -->
  <circle cx="160" cy="140" r="12" fill="#050308" stroke="#00f0ff" stroke-width="2" />
  <text x="160" y="144" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="9">N1</text>
  
  <circle cx="640" cy="140" r="12" fill="#050308" stroke="#ff007f" stroke-width="2" />
  <text x="640" y="144" text-anchor="middle" fill="#ff007f" font-family="monospace" font-size="9">N2</text>
  
  <circle cx="160" cy="360" r="12" fill="#050308" stroke="#ffee00" stroke-width="2" />
  <text x="160" y="364" text-anchor="middle" fill="#ffee00" font-family="monospace" font-size="9">N3</text>
  
  <circle cx="640" cy="360" r="12" fill="#050308" stroke="#00ff66" stroke-width="2" />
  <text x="640" y="364" text-anchor="middle" fill="#00ff66" font-family="monospace" font-size="9">N4</text>
  
  <!-- Connectors -->
  <line x1="172" y1="140" x2="310" y2="210" stroke="#00f0ff" stroke-width="1.5" />
  <line x1="628" y1="140" x2="490" y2="210" stroke="#ff007f" stroke-width="1.5" />
  <line x1="172" y1="360" x2="310" y2="290" stroke="#ffee00" stroke-width="1.5" />
  <line x1="628" y1="360" x2="490" y2="290" stroke="#00ff66" stroke-width="1.5" />
  
  <!-- Telemetry HUD Bar -->
  <rect x="150" y="440" width="500" height="30" fill="#08030f" stroke="#00f0ff" stroke-width="2" />
  <text x="400" y="460" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="12" font-weight="bold">AI_MODEL: GEMINI_INTERACTIONS // CONTEXT_WINDOW: 1M // 800W</text>
</svg>
